[project]
name = "pricegetter"
version = "0.1.0"
description = "EVE Online market loader: fetches ESI orders into Postgres and publishes price aggregates to Redis and CSV."
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "psycopg2>=2.9.13",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "requests-cache>=1.3.3",
    "requests-futures>=1.1.0",
    "requests-oauthlib>=2.0.0",
    "six>=1.17.0",
    "sqlalchemy>=2.1.8",
    "tqdm>=4.70.1",
]

[tool.uv]
package = false
